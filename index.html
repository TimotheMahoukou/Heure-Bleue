<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06163a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heure Bleue">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Heure Bleue</title>
<script>try{var k=localStorage.getItem('hb-skin');if(k)document.documentElement.dataset.skin=k}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
/*
VOICE: un menu de JRPG nocturne, nerveux et sûr de lui, qui parle comme un pote.
IDEA: le calendrier de l'écran de jeu — date géante, moment de la journée, menus en biais.
PICTURE: le panneau de date en biais + le chrono géant ; chaque activité est une ligne de menu.
COLOUR and TYPE: bleu nuit profond, bleu électrique, blanc, accent rose vif ; Anton + Barlow Condensed.
LAYOUT: en-tête oblique, vue au centre, barre d'onglets inclinée en bas, feuilles qui glissent.
*/
:root{color-scheme:dark;--bg:#06163a;--bg2:#0b2463;--blue:#1d4fd8;--cyan:#2ee6ff;--pink:#ff3d7f;--ink:#f3f7ff;--mute:#9db3e6;--line:rgba(46,230,255,.25);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.35 "Barlow Condensed",system-ui,sans-serif;overflow-x:clip;
background-image:radial-gradient(120% 60% at 100% 0,#17408f 0,transparent 60%),repeating-linear-gradient(-62deg,transparent 0 38px,rgba(255,255,255,.025) 38px 40px);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.d{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1}
/* header */
header{position:relative;padding:calc(var(--st) + 14px) 16px 10px;overflow:hidden}
.date{display:flex;align-items:flex-end;gap:12px;position:relative;z-index:1}
.date .n{font-size:84px;line-height:.82;color:#fff;text-shadow:5px 5px 0 var(--blue)}
.date .m{display:flex;flex-direction:column;gap:4px;padding-bottom:4px}
.date .mo{font-size:28px;color:var(--cyan)}
.date .wd{font-size:20px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.04em}
.phase{position:absolute;right:-10px;top:calc(var(--st) + 22px);cursor:pointer;font:inherit;border:0;text-align:right;background:#fff;color:var(--bg);padding:6px 26px 6px 18px;transform:skewX(-18deg);box-shadow:-6px 6px 0 var(--pink);z-index:1}
.phase span{display:block;transform:skewX(18deg);font-size:22px}
.phase small{display:block;transform:skewX(18deg);font:800 13px "Barlow Condensed";text-align:right;opacity:.75}
.phase em{display:block;transform:skewX(18deg);font:800 11px "Barlow Condensed";font-style:normal;color:var(--pink);letter-spacing:.08em}
.phase:active{transform:skewX(-18deg) translate(3px,3px)}
.slab{position:absolute;inset:auto -20px 0 -20px;height:62px;background:linear-gradient(90deg,var(--blue),transparent);transform:skewY(-6deg);transform-origin:left;opacity:.55}
.sum{position:relative;z-index:1;margin-top:8px;color:var(--mute);font-weight:700}
.sum b{color:#fff}
main{padding:6px 14px calc(var(--sb) + 170px)}
/* panels */
.panel{position:relative;background:linear-gradient(135deg,rgba(29,79,216,.55),rgba(11,36,99,.85));border-left:4px solid var(--cyan);clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);padding:14px 16px;margin:0 0 14px}
h2{margin:18px 0 10px;font-size:30px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--cyan),transparent)}
.timer .lab{font-weight:800;text-transform:uppercase;color:var(--cyan);letter-spacing:.06em;font-size:15px}
.timer .clock{font-size:clamp(54px,18vw,86px);color:#fff;font-variant-numeric:tabular-nums;margin:4px 0 10px}
.timer.on{border-left-color:var(--c,var(--pink))}
.timer.on .clock{text-shadow:4px 4px 0 var(--c,var(--pink))}
.timer.on::before{content:"";position:absolute;right:16px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--pink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.idle{color:var(--mute)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;background:#fff;color:var(--bg);font:400 20px Anton,Impact,sans-serif;transform:skewX(-14deg);box-shadow:5px 5px 0 var(--pink);transition:transform .12s}
.btn>*{transform:skewX(14deg)}
.btn:active{transform:skewX(-14deg) translate(3px,3px);box-shadow:2px 2px 0 var(--pink)}
.btn.alt{background:var(--cyan);box-shadow:5px 5px 0 var(--blue)}
.btn.ghost{background:transparent;color:#fff;border:2px solid var(--cyan);box-shadow:none}
.btn.danger{background:var(--pink);color:#fff;box-shadow:5px 5px 0 #000}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
/* menu list */
.menu{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mi{display:grid;grid-template-columns:10px minmax(0,1fr) auto 48px;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 0 0 0;background:rgba(6,22,58,.7);border:1px solid var(--line);transform:skewX(-10deg);text-align:left;transition:background .15s,transform .15s}
.mi>*{transform:skewX(10deg)}
.mi .sw{height:100%;min-height:58px;background:var(--c);transform:none}
.mi .nm{font-size:21px;font-weight:800;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .tm{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.mi .go{height:58px;display:grid;place-items:center;background:var(--c);color:var(--bg);font-size:22px;transform:none}
.mi.act{background:#fff;color:var(--bg)}.mi.act .tm{color:var(--bg)}
.mi:active{transform:skewX(-10deg) translateX(6px)}
/* entries */
.ent{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 4px 10px 0;border-bottom:1px solid var(--line);text-align:left;min-height:52px}
.ent i{align-self:stretch;background:var(--c)}
.ent .t{font-size:14px;color:var(--mute);white-space:nowrap}
.ent .c{font-weight:800;text-transform:uppercase}
.ent .no{font-weight:500;color:var(--mute);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .du{font:400 22px Anton,Impact,sans-serif;white-space:nowrap}
.empty{color:var(--mute);font-weight:500;padding:10px 0}
/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
.calh .d{font-size:30px;text-transform:uppercase}
.nav{width:46px;height:46px;background:var(--blue);transform:skewX(-14deg);font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdh{text-align:center;color:var(--cyan);font-weight:800;font-size:14px;padding-bottom:4px}
.dc{position:relative;aspect-ratio:1/1.15;background:rgba(11,36,99,.75);border:1px solid transparent;display:flex;flex-direction:column;justify-content:space-between;padding:4px;text-align:left;overflow:hidden}
.dc .dn{font:400 19px Anton,Impact,sans-serif}
.dc.out{opacity:.3}
.dc.we .dn{color:var(--pink)}
.dc.today{background:var(--blue)}
.dc.sel{border-color:#fff;box-shadow:inset 0 0 0 2px #fff}
.dc .bar{display:flex;height:6px;gap:1px}
.dc .bar span{background:var(--c)}
.dc .h{font-size:11px;color:var(--mute);font-weight:700;white-space:nowrap}
/* stats */
.big{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big .d{font-size:64px;color:#fff;text-shadow:4px 4px 0 var(--blue)}
.delta{font-weight:800;padding:3px 10px;transform:skewX(-12deg);background:var(--cyan);color:var(--bg)}
.delta.neg{background:var(--pink);color:#fff}
.srow{margin:12px 0}
.srow .top{display:flex;justify-content:space-between;gap:10px;font-weight:800;text-transform:uppercase}
.srow .top span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.track{height:14px;background:rgba(255,255,255,.08);margin-top:5px;transform:skewX(-20deg);overflow:hidden}
.track div{height:100%;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.goal{font-size:14px;color:var(--mute);font-weight:600;margin-top:3px}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:170px;margin-top:8px}
.col{display:flex;flex-direction:column-reverse;height:100%;position:relative}
.col .stk{display:flex;flex-direction:column-reverse;gap:1px}
.col .stk span{background:var(--c);min-height:2px}
.cl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:14px;color:var(--mute);font-weight:800;margin-top:4px}
.cl .now{color:#fff}
.colv{font-size:12px;text-align:center;color:var(--mute);white-space:nowrap;margin-bottom:2px}
/* settings */
.cat{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:56px;border-bottom:1px solid var(--line);text-align:left}
.cat i{width:28px;height:28px;background:var(--c);transform:skewX(-14deg)}
.cat .g{color:var(--mute);font-size:15px;white-space:nowrap}
textarea{width:100%;min-height:120px;background:#020b22;border:1px solid var(--line);padding:10px;font:500 14px ui-monospace,monospace}
/* sport */
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec{background:rgba(6,22,58,.7);border-top:4px solid var(--c,var(--pink));padding:10px 12px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);text-align:left;width:100%}
.rec .k{font-size:13px;color:var(--mute);text-transform:uppercase;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .v{font-size:34px;color:#fff;margin-top:4px;white-space:nowrap}
.rec .v small{font:700 15px "Barlow Condensed";color:var(--cyan)}
.rec .w{font-size:13px;color:var(--mute);font-weight:600}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;min-height:62px;padding:8px 18px;background:rgba(6,22,58,.7);border:1px solid var(--line);border-left:8px solid var(--c,var(--pink));transform:skewX(-10deg);text-align:left}
.ex .gp{color:var(--c);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.gchips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.gchips .chip{flex:none}
.ptab{position:fixed;right:0;top:46%;z-index:4;display:none;width:26px;padding:14px 0;background:var(--cyan);color:var(--bg);box-shadow:-4px 4px 0 var(--pink);font:400 15px Anton,Impact,sans-serif;letter-spacing:.12em}
.ptab span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto}
body.gymv .ptab{display:block}body.gymv main{padding-right:36px}
.prog{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;margin-bottom:10px;padding:14px;background:rgba(255,255,255,.07);border-left:6px solid var(--c);text-align:left;color:var(--ink)}
.prog .nm{font:400 24px Anton,Impact,sans-serif;text-transform:uppercase;color:var(--c)}.prog .l{color:var(--mute);font-weight:600;font-size:14px}.prog .l b{color:var(--ink)}
.psteps{list-style:none;margin:14px 0 0;padding:0}
.pstep{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.pstep .no{display:grid;place-items:center;width:30px;height:30px;background:var(--c);color:#06163a;font:400 18px Anton,Impact,sans-serif;transform:skewX(-12deg)}
.pstep .nm{font-weight:800;text-transform:uppercase}.pstep .l{color:var(--mute);font-size:13px;font-weight:600}.pstep .l b{color:var(--ink)}.pstep.ok .nm{opacity:.7}

.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border-left:6px solid var(--c,#fff);text-align:left;color:var(--ink)}.pick .nm{font:400 22px Anton,Impact,sans-serif;text-transform:uppercase}.pick small{color:var(--mute);font-weight:700;font-size:13px;text-transform:uppercase}#lex{margin-top:10px}
.gl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:52px;border-bottom:1px solid var(--line);text-align:left}
.gl i{width:28px;height:28px;background:var(--c);transform:skewX(-14deg)}
.gl .g{color:var(--mute);font-size:15px;white-space:nowrap}
input[type=color]{width:64px;height:46px;padding:2px;background:#020b22;border:1px solid var(--line)}
.ex>*{transform:skewX(10deg)}
.ex .nm{font-size:20px;font-weight:800;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .ls{font-size:15px;color:var(--mute);font-weight:600;grid-column:1}
.ex .pr{grid-row:1/3;grid-column:2;text-align:right;font:400 24px Anton,Impact,sans-serif;white-space:nowrap}
.ex .pr small{display:block;font:800 11px "Barlow Condensed";color:var(--c,var(--pink));letter-spacing:.06em}
.setrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center;margin-top:8px}
.setrow .no{font:400 20px Anton,Impact,sans-serif;color:var(--cyan);text-align:center}
.setrow .x{height:46px;background:rgba(255,61,127,.2);color:var(--pink);font-size:22px;font-weight:800}
.sh{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;color:var(--cyan);font-weight:800;font-size:13px;text-transform:uppercase;margin-top:12px}
.sh span:first-child{text-align:center}
.prog{position:relative;height:190px;margin:8px 0 4px}
.prog svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.hist .dt{color:var(--mute);font-size:14px}
.hist .st{font-weight:700}
.hist .b{grid-row:1/3;grid-column:2;font:400 22px Anton,Impact,sans-serif;align-self:center;white-space:nowrap}
.hist .b.pr{color:var(--pink)}
.boom{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;visibility:hidden}
.boom.go{visibility:visible;animation:boomo 1.6s ease-out forwards}
.boom div{background:var(--pink);color:#fff;padding:14px 34px;transform:skewX(-14deg) rotate(-6deg);font:400 44px Anton,Impact,sans-serif;box-shadow:8px 8px 0 #fff,16px 16px 0 var(--blue);animation:boomi .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes boomo{0%,70%{opacity:1}100%{opacity:0}}
@keyframes boomi{from{transform:skewX(-14deg) rotate(-6deg) scale(2.4);opacity:0}}
/* corps & rangs */
.body{position:relative;margin:4px -6px 0}
.body svg{display:block;width:100%;height:auto}
.body .z{cursor:pointer;transition:opacity .4s}.body .bs{fill:#2d4fa6;stroke:#2d4fa6;stroke-width:3;stroke-linejoin:round}.body .z{stroke-width:1.5;stroke-linejoin:round}
.body text{font:400 13px Anton,Impact,sans-serif;fill:var(--mute);letter-spacing:.08em}
.rk{display:inline-grid;place-items:center;flex:none;width:42px;height:42px;background:var(--rc,#5b6b8f);color:#06163a;font:400 26px Anton,Impact,sans-serif;transform:skewX(-12deg)}
.rk>span{transform:skewX(12deg)}
.rk.big{width:86px;height:86px;font-size:60px;box-shadow:6px 6px 0 #fff}
.rk.s{box-shadow:0 0 18px var(--rc)}.rk.p{background:linear-gradient(135deg,#fff 0%,#ffd23d 35%,#2ee6ff 65%,#ff3d7f 100%);box-shadow:0 0 22px #fff,0 0 8px #ffd23d}
.rk.big.s{box-shadow:6px 6px 0 #fff,0 0 28px var(--rc)}
.rk.sm{width:30px;height:30px;font-size:18px}
.glob{display:flex;gap:16px;align-items:center;margin-top:6px}
.glob .t{font-size:15px;color:var(--mute);font-weight:600}
.glob .t b{display:block;font:400 26px Anton,Impact,sans-serif;color:#fff;font-weight:400}
.gr{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.gr .nm{font-weight:800;text-transform:uppercase;color:var(--c)}
.gr .sub{font-size:14px;color:var(--mute);font-weight:600}
.gr .pc{font:400 20px Anton,Impact,sans-serif;white-space:nowrap;text-align:right}
.gr .pc small{display:block;margin-bottom:2px;font:700 11px "Barlow Condensed";color:var(--mute)}
.mini{height:6px;background:rgba(255,255,255,.1);margin-top:4px;transform:skewX(-20deg)}
.mini div{height:100%;background:var(--c)}
.xr{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.xr .nm{font-weight:800;text-transform:uppercase}
.xr .l{font-size:15px;color:var(--mute);font-weight:600}
.xr .l b{color:#fff}
.note{font-size:13px;color:var(--mute);font-weight:500;margin-top:10px}
/* accueil */
.hero{position:relative;min-height:400px;margin:0 -14px;overflow:hidden}
.hero .fig{position:absolute;left:-4%;top:0;bottom:0;width:62%;display:grid;place-items:center;animation:float 5s ease-in-out infinite}
.hero .fig img{max-width:100%;max-height:390px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(46,230,255,.45))}
.hero .fig svg{width:100%;max-height:380px}
@keyframes float{50%{transform:translateY(-14px) rotate(-1.5deg)}}
.hero .moon{position:absolute;left:8%;top:12px;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(46,230,255,.28),rgba(29,79,216,.12) 55%,transparent 70%)}
.hmenu{position:relative;z-index:1;list-style:none;margin:0;padding:22px 10px 10px 0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hmenu button{display:block;padding:4px 18px 4px 26px;font:400 clamp(38px,12vw,56px)/1 Anton,Impact,sans-serif;color:#fff;text-transform:uppercase;transform:skewX(-12deg) rotate(-4deg);text-shadow:4px 4px 0 var(--blue);transition:transform .15s,background .15s,color .15s}
.hmenu li:nth-child(2n) button{margin-right:22px}
.hmenu button small{display:block;font:800 13px "Barlow Condensed";color:var(--cyan);text-shadow:none;letter-spacing:.06em;text-align:right}
.hmenu button:hover,.hmenu button:focus-visible,.hmenu button:active{background:#fff;color:var(--bg);text-shadow:4px 4px 0 var(--pink);transform:skewX(-12deg) rotate(-4deg) translateX(-8px)}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font-weight:700;font-size:14px;text-align:center}
.up{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.up .when{font:400 20px Anton,Impact,sans-serif;color:#fff;white-space:nowrap}
.up .when small{display:block;font:800 12px "Barlow Condensed";color:var(--cyan);text-transform:uppercase}
.up .ti{font-weight:800;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .ca{font-size:14px;color:var(--c,var(--mute));font-weight:700}
.up i{width:12px;height:12px;background:var(--c,#fff);transform:rotate(45deg)}
.dc.pl::after{content:"";position:absolute;right:5px;top:6px;width:7px;height:7px;background:#fff;transform:rotate(45deg)}
.player{display:flex;align-items:center;gap:10px;margin-top:6px}
.pbtn{width:50px;height:50px;flex:none;background:var(--blue);transform:skewX(-12deg);font-size:20px;color:#fff}
.pbtn.main{background:#fff;color:var(--bg);width:60px;height:60px;box-shadow:4px 4px 0 var(--pink)}
.now{min-width:0;flex:1}
.now b{display:block;font:400 20px Anton,Impact,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{color:var(--mute);font-weight:600}
.trk{display:grid;grid-template-columns:48px minmax(0,1fr) 44px;padding:5px 0;gap:8px;align-items:center;min-height:46px;border-bottom:1px solid var(--line)}

function dayKey(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function monday(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function fmt(sec){const m=Math.round(sec/60);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+String(r).padStart(2,'0'):'')}
function fmtH(sec){const h=sec/3600;return h<10?h.toFixed(1).replace('.',','):Math.round(h)+''}
function clock(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
function hm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const cat=id=>S.cats.find(c=>c.id===id)||{name:'Supprimée',color:'#5b6b8f',id};
function phase(h){return h<5?['Minuit passé','nuit']:h<8?['Aube','tôt']:h<12?['Matin','']:h<14?['Midi','']:h<18?['Après-midi','']:h<21?['Soir','']:['Nuit','']}
function entriesOn(k){return S.entries.filter(e=>dayKey(e.start)===k).sort((a,b)=>a.start-b.start)}
function live(){return S.timer?(Date.now()-S.timer.start)/1000:0}
function secsOn(k,cid){let t=entriesOn(k).filter(e=>!cid||e.cat===cid).reduce((a,e)=>a+e.dur,0);if(S.timer&&dayKey(S.timer.start)===k&&(!cid||S.timer.cat===cid))t+=live();return t}
function range(a,b,cid){let t=S.entries.filter(e=>e.start>=a&&e.start<b&&(!cid||e.cat===cid)).reduce((s,e)=>s+e.dur,0);if(S.timer&&S.timer.start>=a&&S.timer.start<b&&(!cid||S.timer.cat===cid))t+=live();return t}

function stopTimer(quiet){

function vCal(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=monday(new Date(y,m,1)),today=dayKey(new Date());
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(first);d.setDate(first.getDate()+i);const k=dayKey(d);
    if(i>=35&&d.getMonth()!==m)break;
    const tot=secsOn(k);const parts=S.cats.map(c=>[c,secsOn(k,c.id)]).filter(p=>p[1]>0);
    cells+=`<button class="dc${plansOn(k).length?' pl':''}${d.getMonth()!==m?' out':''}${k===today?' today':''}${k===selDay?' sel':''}${d.getDay()%6===0?' we':''}" data-day="${k}" aria-label="${d.getDate()} ${MONL[d.getMonth()]}"><span class="dn">${d.getDate()}</span><span>${tot?`<span class="h">${fmtH(tot)} h</span><span class="bar">${parts.map(p=>`<span style="--c:${esc(p[0].color)};flex:${p[1]}"></span>`).join('')}</span>`:''}</span></button>`;
  }

  return `<div class="calh" style="--i:0"><button class="nav" data-cm="-1" aria-label="Mois précédent">‹</button><span class="d">${MONL[m]} ${y}</span><button class="nav" data-cm="1" aria-label="Mois suivant">›</button></div>

  let o=d.b.map(p=>`<polygon class="bs" points="${P(p)}"/>`).join('');
  for(const [k,q] of d.z){const g=bodyGroup(k);const sc_=g?gInfo(g.id).s:0;const col=g?okCol(g.color):'#9db3e6';
    o+=`<polygon class="z" data-zone="${esc(g?g.id:'')}" points="${P(q)}" fill="${col}" stroke="${col}" fill-opacity="${(.22+Math.min(6,sc_)/6*.78).toFixed(2)}" stroke-opacity="${(.22+Math.min(6,sc_)/6*.78).toFixed(2)}"${sc_>=5?` style="filter:drop-shadow(0 0 4px ${col})"`:''}/>`}
  return o+`<text x="${ox+100}" y="374" text-anchor="middle" >${label}</text>`}
function bodyPanel(){
  const G=globalScore(),P=prof();
  const rows=BODYG.map(k=>bodyGroup(k)).filter(Boolean).map(g=>{const i=gInfo(g.id),fr=Math.min(1,i.s-Math.floor(i.s));
    return `<button class="gr" style="--c:${okCol(g.color)}" data-zone="${esc(g.id)}">${badge(i.s)}<span><span class="nm">${esc(g.name)}</span><div class="sub">${i.str?'force + volume':'volume seulement'} · ${Math.round(i.vr)} reps / 30 j</div><div class="mini"><div style="width:${i.s>=6?100:fr*100}%"></div></div></span><span class="pc">${i.str?'<small>mieux que</small>'+pct(i.str.s)+' %':'<small>pas de</small>barème'}</span></button>`}).join('');
  return `<section class="panel" style="--i:0"><div class="d" style="font-size:30px">Ton corps</div>
  <div class="body"><svg viewBox="0 0 410 380" role="img" aria-label="Carte des muscles, face et dos">${figure(FIG.f,0,'FACE')}${figure(FIG.k,210,'DOS')}</svg></div>
  <div class="glob">${badge(G,'big')}<div class="t"><b>Rang global ${rk(G)}</b>${P?`${esc(kg(P.bw))} kg · ${P.h?esc((P.h/100).toFixed(2).replace('.',','))+' m · ':''}${P.sex==='f'?'femme':'homme'}`:'Profil à remplir pour te comparer'}<div class="row" style="margin-top:8px"><button class="btn ghost" data-prof style="min-height:40px;font-size:16px;padding:0 16px"><span>${P?'Modifier le profil':'Remplir mon profil'}</span></button></div></div></div>
  </section><h2 class="d" style="--i:1">Rangs par muscle</h2><div style="--i:2">${rows}<div class="note">Le rang mélange ta force (meilleure charge ou meilleur nombre de reps, comparés à des barèmes publics selon ton poids, ta taille et ton sexe ; un grand gabarit a des leviers plus longs, donc on corrige un peu ; quand tu es lesté, le lest s’ajoute à ton poids) et ton volume des 30 derniers jours. « Mieux que » estime la part des gens qui s’entraînent que tu dépasses. Ce sont des repères, pas une vérité.</div></div>`}
function zoneSheet(gid){
  const g=grp(gid);if(!g.id)return;const i=gInfo(gid),P=prof();
  const xs=S.exos.filter(x=>x.g===gid).map(x=>{const e=exScore(x),st=STD[x.id];
    if(!e)return `<div class="xr"><span class="rk sm" style="--rc:#26386b"><span>–</span></span><div><div class="nm">${esc(x.name)}</div><div class="l">${!st?'Pas de barème : compte seulement dans le volume.':st[0]==='kg'&&!P?'Remplis ton profil pour avoir un rang.':'Pas encore de perf notée.'}</div></div></div>`;
    const nx=Math.floor(e.s),unit=e.type==='kg'?' kg':e.type==='sec'?' s':' reps',val=e.type==='kg'?kg(Math.round(e.e1*2)/2)+' kg (max estimé sur 1 rep) · '+kg(Math.round(e.v*100)/100)+' × ton poids':Math.round(e.v)+unit+(x.bw&&e.type==='reps'?' (équivalent au poids du corps)':'');
    const tv=nx>=5?e.t[4]*1.2:e.t[nx];const tgt=nx>=6?'Rang P : top 1 %, parfait.':`Prochain rang ${RK[nx+1]} : ${e.type==='kg'?kg(Math.ceil(tv*P.bw/e.adj*2)/2)+' kg sur 1 rep':Math.ceil(tv/e.adj)+unit+(x.bw&&e.type==='reps'?' au poids du corps':'')}`;
    return `<div class="xr">${badge(e.s)}<div><div class="nm">${esc(x.name)}</div><div class="l"><b>${esc(val)}</b></div><div class="l">Mieux que ~${pct(e.s)} % des pratiquants · ${esc(tgt)}</div></div></div>`}).join('');
  openSheet(`<h3 style="color:${okCol(g.color)}">${esc(g.name)}</h3><div class="glob">${badge(i.s,'big')}<div class="t"><b>Rang ${rk(i.s)}</b>${Math.round(i.vr)} reps sur 30 jours (volume : rang ${rk(i.vol)})</div></div>
  <div style="margin-top:12px">${xs||'<div class="empty">Aucun exercice dans ce groupe.</div>'}</div><div class="acts"><button class="btn ghost" data-close><span>Fermer</span></button></div>`)}

  ${recs.length?`<div class="recs" style="margin-top:14px">${recs.map(([x,r])=>`<button class="rec" style="--c:${xcol(x)}" data-exo="${esc(x.id)}"><div class="k">${esc(x.name)}</div><div class="v d">${r.w?(x.bw?'+':'')+esc(kg(r.w))+'<small> kg × '+r.r+'</small>':r.r+'<small> reps</small>'}</div><div class="w">le ${esc(dshort(r.date))}</div></button>`).join('')}</div>`:'<div class="empty">Note ta première perf : tes records apparaîtront ici.</div>'}</section>
  <h2 class="d" style="--i:1">Exercices</h2>
  <div class="gchips" style="--i:2"><button class="chip" style="--c:#fff" data-gf="" aria-pressed="${!gymF}">Tous</button>${S.groups.map(g=>`<button class="chip" style="--c:${okCol(g.color)}" data-gf="${esc(g.id)}" aria-pressed="${gymF===g.id}">${esc(g.name)}</button>`).join('')}</div>
  <ul class="menu" style="--i:3">${list||'<li class="empty">Aucun exercice dans ce groupe.</li>'}</ul>
  <div class="row" style="margin-top:14px;--i:4"><button class="btn alt" data-newexo><span>Nouvel exercice</span></button></div>
  <h2 class="d" style="--i:5">Groupes musculaires</h2><div style="--i:6">${S.groups.map(g=>`<button class="gl" style="--c:${okCol(g.color)}" data-grp="${esc(g.id)}"><i></i><span style="font-weight:800;text-transform:uppercase">${esc(g.name)}</span><span class="g">${S.exos.filter(x=>x.g===g.id).length} exercice(s)</span></button>`).join('')}
  <div class="row" style="margin-top:14px"><button class="btn ghost" data-grp="new"><span>Nouveau groupe</span></button></div></div>`;
}
function liftSheet(l,exoId,pre){
  const isNew=!l;
  if(!l){const prev=exoId&&liftsOf(exoId).pop();l={exo:exoId||S.exos[0]?.id,date:Date.now(),sets:prev?prev.sets.map(s=>({...s})):[{r:10,w:0},{r:10,w:0},{r:10,w:0}],note:''};
    if(pre){const w=prev?best(prev).w:0;l.sets=Array.from({length:pre.n},()=>({r:pre.r,w}))}}
  let sets=l.sets.map(s=>({...s})),sel=l.exo;let mode=l.mode||(l.sets.some(z=>z.w>0)?'lest':'bw');
  const isBw=()=>!!exo(sel).bw;
  const head=()=>`<span>Série</span><span>${STD[sel]&&STD[sel][0]==='sec'?'Secondes':'Reps'}</span><span>${isBw()?(mode==='lest'?'Lest (kg)':''):PERDB.has(sel)?'Kg par haltère':'Charge (kg)'}</span><span></span>`;
  const modeH=()=>isBw()?`<label class="f">Type</label><div class="chips"><button type="button" class="chip" style="--c:var(--cyan)" data-m="bw" aria-pressed="${mode==='bw'}">Poids du corps</button><button type="button" class="chip" style="--c:var(--pink)" data-m="lest" aria-pressed="${mode==='lest'}">Lesté</button></div>`:PERDB.has(sel)?'<div class="note" style="margin:10px 0 0">Note le poids d’<b>un seul</b> haltère. Ex. : deux haltères de 24 kg → écris 24.</div>':'';
  const rows=()=>sets.map((s,i)=>`<div class="setrow"><span class="no">${i+1}</span><input class="in" inputmode="numeric" aria-label="Répétitions série ${i+1}" data-si="${i}" data-k="r" value="${s.r}">${isBw()&&mode==='bw'?'<span style="color:var(--mute);font-weight:700;font-size:14px">poids du corps</span>':`<input class="in" inputmode="decimal" aria-label="${isBw()?'Lest':'Charge'} série ${i+1}" data-si="${i}" data-k="w" value="${kg(s.w)}">`}<button type="button" class="x" data-rm="${i}" aria-label="Retirer la série">×</button></div>`).join('');
  openSheet(`<h3>${isNew?'Noter une perf':'Modifier la perf'}</h3><form id="lf">
  <label class="f">Exercice</label><button type="button" class="pick" id="lpick" aria-expanded="false"></button><div id="lex" hidden><div class="gchips" id="lgx"></div><div class="chips" id="lxl"></div></div>
  <label class="f" for="ldate">Jour</label><input class="in" type="date" id="ldate" value="${dayKey(l.date)}" required>
  <div id="lmw">${modeH()}</div><div class="sh" id="lsh">${head()}</div><div id="lsets">${rows()}</div>
  <div class="row" style="margin-top:12px"><button type="button" class="btn alt" id="ladd"><span>+ Série</span></button></div>
  <label class="f" for="lnote">Note (facultatif)</label><input class="in" id="lnote" maxlength="80" placeholder="ex. bonne forme, prise serrée…" value="${esc(l.note)}">
  <div class="acts"><button class="btn" type="submit"><span>Enregistrer</span></button>${isNew?'':'<button class="btn danger" type="button" id="ldel"><span>Supprimer</span></button>'}<button class="btn ghost" type="button" data-close><span>Annuler</span></button></div></form>`);
  const box=$('lsets');
  const redraw=()=>{$('lmw').innerHTML=modeH();$('lsh').innerHTML=head();box.innerHTML=rows()};
  $('lmw').onclick=ev=>{const b=ev.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;if(mode==='bw')sets.forEach(z=>z.w=0);redraw()};
  box.oninput=ev=>{const t=ev.target;if(t.dataset.si!=null)sets[+t.dataset.si][t.dataset.k]=num(t.value)};
  box.onclick=ev=>{const b=ev.target.closest('[data-rm]');if(!b)return;sets.splice(+b.dataset.rm,1);box.innerHTML=rows()};
  $('ladd').onclick=()=>{sets.push({...(sets[sets.length-1]||{r:10,w:0})});box.innerHTML=rows()};
  let pg=exo(sel).g;
  const pickH=()=>{const x=exo(sel);$('lpick').style.setProperty('--c',xcol(x));$('lpick').innerHTML=`<span class="nm">${esc(x.name||'Choisis un exercice')}</span><small>${esc(grp(x.g).name||'')} · ${$('lex').hidden?'changer':'fermer'}</small>`};
  const listH=()=>{const gs=S.groups.filter(g=>S.exos.some(x=>x.g===g.id));const orph=S.exos.some(x=>!gs.some(g=>g.id===x.g));
    $('lgx').innerHTML=gs.map(g=>`<button type="button" class="chip" style="--c:${okCol(g.color)}" data-lg="${esc(g.id)}" aria-pressed="${pg===g.id}">${esc(g.name)}</button>`).join('')+(orph?`<button type="button" class="chip" style="--c:#fff" data-lg="_" aria-pressed="${pg==='_'}">Autres</button>`:'');
    $('lxl').innerHTML=S.exos.filter(x=>pg==='_'?!gs.some(g=>g.id===x.g):x.g===pg).map(x=>`<button type="button" class="chip" style="--c:${xcol(x)}" data-x="${esc(x.id)}" aria-pressed="${x.id===sel}">${esc(x.name)}</button>`).join('')};
  if(!S.groups.some(g=>g.id===pg))pg='_';pickH();listH();
  $('lpick').onclick=()=>{const h=$('lex').hidden=!$('lex').hidden;$('lpick').setAttribute('aria-expanded',!h);pickH()};
  $('lgx').onclick=ev=>{const b=ev.target.closest('[data-lg]');if(!b)return;pg=b.dataset.lg;listH()};
  $('lxl').onclick=ev=>{const b=ev.target.closest('[data-x]');if(!b)return;sel=b.dataset.x;if(isBw()&&!sets.some(z=>z.w>0))mode='bw';redraw();$('lex').hidden=true;$('lpick').setAttribute('aria-expanded','false');pickH();listH()};
  $('lf').onsubmit=ev=>{ev.preventDefault();const zero=isBw()&&mode==='bw';const ok=sets.filter(s=>s.r>0).map(s=>({r:Math.round(s.r),w:zero?0:Math.max(0,s.w)}));if(!ok.length){toast('Ajoute au moins une série');return}
    const d=fromKey($('ldate').value);const n=new Date();d.setHours(n.getHours(),n.getMinutes());
    const old=S.lifts.filter(x=>x.exo===sel&&x.id!==l.id).map(best).reduce((a,b)=>!a||b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a,null);
    const nb=best({sets:ok});const isPR=old&&(nb.w>old.w||(nb.w===old.w&&nb.r>old.r));
    const before=rankMap();const o={id:l.id||uid(),exo:sel,date:+d,sets:ok,note:$('lnote').value.trim(),mode:isBw()?mode:undefined};
    if(isNew)S.lifts.push(o);else Object.assign(S.lifts.find(x=>x.id===l.id),o);
    save();closeSheet();render();if(pre&&pre.back)setTimeout(()=>progSheet(pre.back),400);
    const after=rankMap(),gid=exo(sel).g;
    if(after._>before._)boom('Rang global '+RK[after._]+' !');else if(gid&&after[gid]>before[gid])boom(grp(gid).name+' : rang '+RK[after[gid]]+' !');else if(isPR)boom('Nouveau record !');else toast(isNew?'Perf notée':'Perf modifiée')};
  if(!isNew)$('ldel').onclick=()=>confirmSheet('Supprimer cette perf ?',()=>{S.lifts=S.lifts.filter(x=>x.id!==l.id);save();toast('Perf supprimée');render()});
}

const doneToday=x=>S.lifts.some(l=>l.exo===x&&dayKey(l.date)===dayKey(Date.now()));
const progSteps=pg=>pg.e.filter(([x])=>S.exos.some(e=>e.id===x));
const restT=s=>s>=60?(s%60?Math.floor(s/60)+' min '+s%60:s/60+' min'):s+' s';
function progsSheet(){
  openSheet(`<h3>Programmes</h3><div style="color:var(--mute);font-weight:500;margin-bottom:12px">Choisis une séance et suis les exercices dans l’ordre. Touche « Noter » après chaque exercice.</div>
  ${PROGS.map(pg=>{const st=progSteps(pg),dn=st.filter(([x])=>doneToday(x)).length;return `<button class="prog" style="--c:${pg.c}" data-prog="${pg.id}"><span class="nm">${esc(pg.n)}</span><span class="l">${st.length} exercices · ${pg.d}${dn?` · <b>${dn}/${st.length} fait${dn>1?'s':''} aujourd’hui</b>`:''}</span></button>`}).join('')}
  <div class="acts"><button class="btn ghost" data-close><span>Fermer</span></button></div>`)}
function progSheet(id){
  const pg=PROGS.find(p=>p.id===id);if(!pg)return;const st=progSteps(pg),dn=st.filter(([x])=>doneToday(x)).length;
  openSheet(`<h3 style="color:${pg.c}">${esc(pg.n)}</h3><div style="color:var(--mute);font-weight:500">${esc(pg.i)}</div>
  <div class="mini" style="margin:12px 0 4px;--c:${pg.c}"><div style="width:${st.length?dn/st.length*100:0}%;background:${pg.c}"></div></div><div class="l" style="color:var(--mute);font-weight:700;font-size:13px">${dn}/${st.length} faits aujourd’hui</div>
  <ol class="psteps">${st.map(([x,n,r,rest,tip],i)=>{const e=exo(x),ok=doneToday(x),sec=STD[x]&&STD[x][0]==='sec';return `<li class="pstep${ok?' ok':''}" style="--c:${xcol(e)}"><span class="no">${ok?'✓':i+1}</span><div><div class="nm">${esc(e.name)}</div><div class="l"><b>${n} × ${r}${sec?' s':''}</b> · repos ${restT(rest)}${tip?' · '+esc(tip):''}</div></div><button class="chip" style="--c:${xcol(e)}" data-pstep="${pg.id}:${i}">${ok?'Encore':'Noter'}</button></li>`}).join('')}</ol>
  <div class="acts"><button class="btn ghost" data-progs><span>Tous les programmes</span></button><button class="btn ghost" data-close><span>Fermer</span></button></div>`)}
function exoSheet(id){

  <div class="player"><button class="pbtn" data-mprev aria-label="Morceau précédent">◀◀</button><button class="pbtn main" id="pp" data-mplay aria-label="Lecture ou pause">${audio.paused?'▶':'❚❚'}</button><button class="pbtn" data-mnext aria-label="Morceau suivant">▶▶</button></div>
  <div class="gchips" style="margin-top:14px"><button class="chip" style="--c:var(--cyan)" data-pls="" aria-pressed="${!plSel}">Tout (${L.length})</button>${S.playlists.map(x=>`<button class="chip" style="--c:var(--cyan)" data-pls="${esc(x.id)}" aria-pressed="${plSel===x.id}">${esc(x.name)} (${x.tracks.length})</button>`).join('')}<button class="chip" style="--c:var(--pink)" data-plnew aria-pressed="false">+ Playlist</button></div>
  ${pl?`<div class="row" style="margin:4px 0 6px"><button class="btn alt" data-plplay style="min-height:40px;font-size:15px;padding:0 14px"><span>▶ Lire « ${esc(pl.name)} »</span></button><button class="btn ghost" data-pledit style="min-height:40px;font-size:15px;padding:0 14px"><span>Modifier</span></button></div>`:''}
  <div style="margin-top:6px">${shown.map((t,i)=>`<div class="trk${playQ===plSel&&i===curT?' on':''}" data-i="${i}"><label class="cov" aria-label="Choisir une cover pour ${esc(t.name)}">${coverOf(t)?`<img src="${coverOf(t)}" alt="">`:'+<br>cover'}<input type="file" accept="image/*" data-cov="${esc(t.id)}"></label><button class="t" data-ti="${i}">${esc(t.name)}</button>${t.own?`<button class="rm" data-trm="${esc(t.id)}" aria-label="${pl?'Retirer de la playlist':'Supprimer la musique'}">×</button>`:'<span></span>'}</div>`).join('')||(pl?'<div class="empty">Playlist vide : touche « Modifier » pour choisir ses morceaux.</div>':'<div class="empty">Ajoute tes musiques depuis ton téléphone (fichiers MP3 ou M4A), puis touche le carré à gauche d’un titre pour lui mettre une cover.</div>')}
  ${Q.length>shown.length?`<button class="btn ghost" data-mall style="margin-top:10px;min-height:40px;font-size:15px;padding:0 14px"><span>Voir les ${Q.length} morceaux</span></button>`:showAll&&Q.length>LIM+1?'<button class="btn ghost" data-mall style="margin-top:10px;min-height:40px;font-size:15px;padding:0 14px"><span>Réduire</span></button>':''}</div>
  <div class="row" style="margin-top:12px"><label class="btn filebtn"><span>Ajouter des musiques</span><input type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple id="musIn"></label></div></section>`;
}

const VIEWS={home:vHome,today:vToday,cal:vCal,stats:vStats,gym:vGym,cats:vCats};
function render(anim){
  header();const v=$('view');v.innerHTML=VIEWS[view]();
  if(!anim){for(const el of v.children)el.style.animation='none'}
  document.body.classList.toggle('gymv',view==='gym');
  document.querySelectorAll('.tab').forEach(t=>t.dataset.v===view?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current'));
}
function go(v){if(v===view)return;view=v;const w=$('wipe');w.classList.remove('go');void w.offsetWidth;w.classList.add('go');window.scrollTo(0,0);render(true)}

/* sheets */
let lockY=0;function openSheet(html){$('sheet').innerHTML=html;$('sheet').scrollTop=0;if(!$('scrim').classList.contains('open')){lockY=window.scrollY;document.body.style.top=-lockY+'px';document.body.classList.add('lock')}$('scrim').classList.add('open')}
function closeSheet(){if(!$('scrim').classList.contains('open'))return;$('scrim').classList.remove('open');document.body.classList.remove('lock');document.body.style.top='';window.scrollTo(0,lockY)}
function entrySheet(e,day){
  const isNew=!e;const now=new Date();
  e=e||{cat:(S.timer&&S.timer.cat)||S.cats[0]?.id,start:+(day?new Date(fromKey(day).setHours(17,0,0,0)):new Date(now.getTime()-3600e3)),dur:3600,note:''};
  if(!S.cats.length){toast('Crée d’abord une activité');go('cats');return}
  const d=new Date(e.start),dk=dayKey(d),tm=hm(d),h=Math.floor(e.dur/3600),mn=Math.round(e.dur%3600/60);
  openSheet(`<h3>${isNew?'Nouvelle séance':'Modifier la séance'}</h3><form id="ef">
  <label class="f">Activité</label><div class="chips" id="ecats">${S.cats.map(c=>`<button type="button" class="chip" style="--c:${esc(c.color)}" data-c="${esc(c.id)}" aria-pressed="${c.id===e.cat}">${esc(c.name)}</button>`).join('')}</div>
  <div class="two"><div><label class="f" for="edate">Jour</label><input class="in" type="date" id="edate" value="${dk}" required></div><div><label class="f" for="etime">Début</label><input class="in" type="time" id="etime" value="${tm}" required></div></div>
  <div class="two"><div><label class="f" for="eh">Heures</label><input class="in" type="number" inputmode="numeric" min="0" max="23" id="eh" value="${h}"></div><div><label class="f" for="em">Minutes</label><input class="in" type="number" inputmode="numeric" min="0" max="59" id="em" value="${mn}"></div></div>
  <label class="f" for="enote">Note (facultatif)</label><input class="in" id="enote" maxlength="80" placeholder="ex. exos de maths, jambes…" value="${esc(e.note)}">
  <div class="acts"><button class="btn" type="submit"><span>Enregistrer</span></button>${isNew?'':'<button class="btn danger" type="button" id="edel"><span>Supprimer</span></button>'}<button class="btn ghost" type="button" data-close><span>Annuler</span></button></div></form>`);
  let sel=e.cat;
  $('ecats').onclick=ev=>{const b=ev.target.closest('[data-c]');if(!b)return;sel=b.dataset.c;$('ecats').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('ef').onsubmit=ev=>{ev.preventDefault();const [hh,mm]=$('etime').value.split(':').map(Number);const st=fromKey($('edate').value);st.setHours(hh,mm,0,0);
    const dur=((+$('eh').value||0)*60+(+$('em').value||0))*60;if(dur<60){toast('Indique une durée');return}
    if(isNew)S.entries.push({id:uid(),cat:sel,start:+st,dur,note:$('enote').value.trim()});else Object.assign(S.entries.find(x=>x.id===e.id),{cat:sel,start:+st,dur,note:$('enote').value.trim()});
    save();closeSheet();toast(isNew?'Séance ajoutée':'Séance modifiée');selDay=dayKey(st);render()};
  if(!isNew)$('edel').onclick=()=>confirmSheet('Supprimer cette séance ?',()=>{S.entries=S.entries.filter(x=>x.id!==e.id);save();toast('Séance supprimée');render()});
}
function catSheet(c){
  const isNew=!c;c=c||{id:uid(),name:'',color:COLORS[S.cats.length%COLORS.length],goal:0};
  openSheet(`<h3>${isNew?'Nouvelle activité':'Modifier l’activité'}</h3><form id="cf">
  <label class="f" for="cn">Nom</label><input class="in" id="cn" maxlength="32" required placeholder="ex. Piano, Lecture, Révisions" value="${esc(c.name)}">
  <label class="f">Couleur</label><div class="sw8" id="ccol">${COLORS.map(k=>`<button type="button" style="--c:${k}" data-k="${k}" aria-label="Couleur ${k}" aria-pressed="${k===c.color}"></button>`).join('')}</div>
  <label class="f" for="cg">Objectif par semaine (heures, 0 = aucun)</label><input class="in" type="number" inputmode="decimal" min="0" max="80" step="0.5" id="cg" value="${c.goal/60}">
  <div class="acts"><button class="btn" type="submit"><span>Enregistrer</span></button>${isNew?'':'<button class="btn danger" type="button" id="cdel"><span>Supprimer</span></button>'}<button class="btn ghost" type="button" data-close><span>Annuler</span></button></div></form>`);
  let col=c.color;
  $('ccol').onclick=ev=>{const b=ev.target.closest('[data-k]');if(!b)return;col=b.dataset.k;$('ccol').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('cf').onsubmit=ev=>{ev.preventDefault();const o={id:c.id,name:$('cn').value.trim()||'Activité',color:col,goal:Math.round((+$('cg').value||0)*60)};
    if(isNew)S.cats.push(o);else Object.assign(S.cats.find(x=>x.id===c.id),o);save();closeSheet();toast('Activité enregistrée');render()};
  if(!isNew)$('cdel').onclick=()=>confirmSheet('Supprimer « '+c.name+' » et toutes ses séances ?',()=>{S.cats=S.cats.filter(x=>x.id!==c.id);S.entries=S.entries.filter(x=>x.cat!==c.id);if(S.timer&&S.timer.cat===c.id)S.timer=null;save();render()});
}
function confirmSheet(q,yes){openSheet(`<h3>${esc(q)}</h3><div style="color:var(--mute)">Impossible d’annuler.</div><div class="acts"><button class="btn danger" id="yes"><span>Oui, supprimer</span></button><button class="btn ghost" data-close><span>Non</span></button></div>`);$('yes').onclick=()=>{closeSheet();yes()}}
function importSheet(){openSheet(`<h3>Importer des données</h3><div style="color:var(--mute);font-weight:500">Colle ici le texte copié avec « Copier mes données ». Il remplace tout ce qui est sur ce téléphone.</div><textarea id="itx" aria-label="Données à importer"></textarea><div class="acts"><button class="btn" id="igo"><span>Importer</span></button><button class="btn ghost" data-close><span>Annuler</span></button></div>`);
  $('igo').onclick=()=>{try{const o=JSON.parse($('itx').value);if(!Array.isArray(o.cats)||!Array.isArray(o.entries))throw 0;S={cats:o.cats,entries:o.entries,timer:o.timer||null,plans:o.plans||[],tracks:[],playlists:[],groups:o.groups,exos:o.exos,lifts:o.lifts,profile:o.profile||null,v:o.v};fill();save();closeSheet();toast('Données importées');render()}catch(e){toast('Texte non reconnu')}}}
function exportData(){const txt=JSON.stringify(S);
  const fallback=()=>openSheet(`<h3>Tes données</h3><div style="color:var(--mute);font-weight:500">Sélectionne tout et copie ce texte dans tes notes.</div><textarea readonly>${esc(txt)}</textarea><div class="acts"><button class="btn ghost" data-close><span>Fermer</span></button></div>`);
  try{navigator.clipboard.writeText(txt).then(()=>toast('Copié ! Colle-le dans tes notes'),fallback)}catch(e){fallback()}}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.v)go(ds.v);
  else if('start' in ds)startTimer(ds.start);
  else if('stop' in ds)stopTimer();
  else if(ds.edit)entrySheet(S.entries.find(e=>e.id===ds.edit));
  else if(ds.add)entrySheet(null,ds.add);
  else if('addnow' in ds)entrySheet(null,null);
  else if(ds.day){selDay=ds.day;render()}
  else if(ds.cm){calM.setMonth(calM.getMonth()+ +ds.cm);render(true)}
  else if(ds.wk){wkOff=Math.min(0,wkOff+ +ds.wk);render(true)}
  else if(ds.cat)catSheet(ds.cat==='new'?null:S.cats.find(c=>c.id===ds.cat));
  else if('progs' in ds)progsSheet();
  else if(ds.prog)progSheet(ds.prog);
  else if(ds.pstep){const [pid,i]=ds.pstep.split(':');const pg=PROGS.find(p=>p.id===pid);const st=pg&&progSteps(pg)[+i];if(st)liftSheet(null,st[0],{n:st[1],r:st[2],back:pid})}
  else if(ds.lift)liftSheet(null,ds.lift==='new'?null:ds.lift);
  else if(ds.liftid)liftSheet(S.lifts.find(l=>l.id===ds.liftid));
  else if(ds.exo)exoSheet(ds.exo);
  else if('newexo' in ds)exoNameSheet(null);
  else if('prof' in ds)profSheet();
  else if('wup' in ds)updateWidget();
  else if(ds.skin){S.skin=ds.skin==='vert'?'vert':'bleu';save();applySkin();render();toast('Thème '+(S.skin==='vert'?'Néon vert':'Nuit bleue'))}
  else if('wscript' in ds)copyScript();
  else if('plannew' in ds)planSheet(null,ds.plannew||null);
  else if(ds.plan)planSheet(S.plans.find(p=>p.id===ds.plan));
  else if('mplay' in ds)togglePlay();
  else if('mnext' in ds)playT(curT+1);
  else if('mprev' in ds)playT(curT-1);
  else if(ds.ti)playT(+ds.ti,plSel);
  else if('pls' in ds){plSel=ds.pls;showAll=false;render()}
  else if('plnew' in ds)plSheet(null);
  else if('pledit' in ds)plSheet(S.playlists.find(x=>x.id===plSel));
  else if('plplay' in ds)playT(0,plSel);
  else if('mall' in ds){showAll=!showAll;render()}
  else if(ds.trm&&plSel){const pl=S.playlists.find(x=>x.id===plSel);const t=curTrack();pl.tracks=pl.tracks.filter(id=>id!==ds.trm);if(playQ===plSel){if(t&&t.id===ds.trm){audio.pause();audio.removeAttribute('src');curT=-1}else curT=t?pl.tracks.indexOf(t.id):-1}save();render();toast('Retirée de la playlist')}
  else if(ds.trm){const t0=curTrack();if(t0&&t0.id===ds.trm){audio.pause();audio.removeAttribute('src');curT=-1}S.playlists.forEach(x=>x.tracks=x.tracks.filter(id=>id!==ds.trm));const id=ds.trm;const keepT=curTrack();S.tracks=S.tracks.filter(t=>t.id!==id);if(keepT&&keepT.id!==id)curT=queue(playQ).findIndex(t=>t.id===keepT.id);delete S.covers[id];idb.del('track:'+id).catch(()=>{});idb.del('cover:'+id).catch(()=>{});save();render()}
  else if(ds.zone)zoneSheet(ds.zone);
  else if('gf' in ds){gymF=ds.gf;render()}
  else if(ds.grp)grpSheet(ds.grp==='new'?null:grp(ds.grp));
  else if('exp' in ds)exportData();
  else if('imp' in ds)importSheet();
  else if('wipe' in ds)confirmSheet('Tout effacer ?',()=>{S=structuredClone(DEF);fill();save();render();toast('Tout est remis à zéro')});
  else if('close' in ds)closeSheet();
});
$('view').addEventListener('click',ev=>{const z=ev.target.closest('polygon[data-zone]');if(z&&z.dataset.zone)zoneSheet(z.dataset.zone)});
/* bloque le zoom (pincement et double-tap) */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
$('homeBtn').onclick=()=>{closeSheet();go('home')};
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='heroIn'&&t.files[0]){const f=t.files[0];idb.put('hero',f).then(()=>{if(heroURL)URL.revokeObjectURL(heroURL);heroURL=URL.createObjectURL(f);render();toast('Visuel enregistré')}).catch(()=>toast('Impossible d’enregistrer l’image'))}
  if(t.dataset&&t.dataset.cov&&t.files[0])setCover(t.dataset.cov,t.files[0]);
  if(t.id==='musIn'&&t.files.length)addTracks([...t.files])});
audio.onplay=audio.onpause=musicUI;
$('scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')closeSheet()});
setInterval(()=>{if(S.timer){const c=$('clk');if(c)c.textContent=clock(live());const k=dayKey(new Date());document.querySelectorAll('[data-tm]').forEach(el=>el.textContent=fmt(secsOn(k,el.dataset.tm)))}header();checkReminders()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
applySkin();
render(true);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
